services:
  telegram_bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg_restricted_content_bot
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      - ./downloads:/app/downloads
      - ./database:/app/database
